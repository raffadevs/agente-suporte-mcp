name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: ${{ matrix.servico }} (build, test, integration test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [sistema-chamados, mcp-server, agente]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.servico }}/pom.xml

      - name: Testes unitários e de integração (Testcontainers)
        run: mvn -B -q verify

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.servico }}-test-reports
          path: |
            ${{ matrix.servico }}/target/surefire-reports
            ${{ matrix.servico }}/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run lint

      - name: Rodar testes
        run: npm run test

      - name: Build de produção
        run: npm run build

  docker-build:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem do sistema-chamados
        run: docker build -t agente-suporte-mcp-sistema-chamados:ci ./sistema-chamados

      - name: Build da imagem do mcp-server
        run: docker build -t agente-suporte-mcp-mcp-server:ci ./mcp-server

      - name: Build da imagem do agente
        run: docker build -t agente-suporte-mcp-agente:ci ./agente

      - name: Build da imagem do frontend
        run: docker build -t agente-suporte-mcp-frontend:ci ./frontend
